<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient Tile -->
    <linearGradient id="meddiyLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Metallic Gradient for Stethoscope Headset -->
    <linearGradient id="meddiyMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Chestpiece Metallic Rim -->
    <linearGradient id="meddiyRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Diaphragm Acoustic Disc Core -->
    <radialGradient id="meddiyDiaphragm" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Soft Drop Shadows -->
    <filter id="meddiyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>

    <filter id="meddiyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#meddiyLogoBg)" filter="url(#meddiyShadow)" />
  
  <!-- Subtle High-Gloss Border Highlight -->
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

  <!-- STETHOSCOPE -->
  <!-- 1. Binaural Headset (Chrome eartubes) -->
  <g filter="url(#meddiyGlow)">
    <!-- Left binaural chrome tube -->
    <path d="M 180 128 C 180 162 216 202 248 218" fill="none" stroke="url(#meddiyMetalGrad)" stroke-width="15" stroke-linecap="round" />
    <!-- Right binaural chrome tube -->
    <path d="M 332 128 C 332 162 296 202 264 218" fill="none" stroke="url(#meddiyMetalGrad)" stroke-width="15" stroke-linecap="round" />
    
    <!-- Central Tension Spring Bar -->
    <path d="M 206 172 Q 256 186 306 172" fill="none" stroke="url(#meddiyMetalGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Left Eartip (Olive silicone tip) -->
    <path d="M 166 114 C 162 110 170 100 178 106 L 186 114 C 192 120 184 128 176 124 Z" fill="#F8FAFC" />
    <circle cx="172" cy="115" r="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3.5" />

    <!-- Right Eartip (Olive silicone tip) -->
    <path d="M 346 114 C 350 110 342 100 334 106 L 326 114 C 320 120 328 128 336 124 Z" fill="#F8FAFC" />
    <circle cx="340" cy="115" r="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3.5" />
  </g>

  <!-- Y-Connector Collar -->
  <rect x="249" y="213" width="14" height="24" rx="5" fill="url(#meddiyMetalGrad)" />

  <!-- 2. Acoustic Flexible Tubing (Contoured medical loop) -->
  <!-- Tubing drop shadow -->
  <path d="M 256 234 
           C 256 274 200 314 170 344 
           C 135 379 145 429 195 429 
           C 245 429 285 369 315 324
           C 335 294 355 284 375 284" 
        fill="none" 
        stroke="rgba(15,23,42,0.28)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        transform="translate(0, 4)" />

  <!-- Main flexible tube (Pure white with glossy finish) -->
  <path d="M 256 234 
           C 256 274 200 314 170 344 
           C 135 379 145 429 195 429 
           C 245 429 285 369 315 324
           C 335 294 355 284 375 284" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Specular 3D Reflection Highlight -->
  <path d="M 256 236 
           C 256 272 202 312 172 342 
           C 138 377 147 425 195 425 
           C 243 425 283 367 313 322
           C 333 292 353 282 373 282" 
        fill="none" 
        stroke="rgba(255,255,255,0.75)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 3. Stethoscope Chestpiece (Diaphragm & Bell) -->
  <g transform="translate(375, 284)">
    <!-- Connector Stem -->
    <path d="M 0 0 L 16 0" stroke="url(#meddiyMetalGrad)" stroke-width="13" stroke-linecap="round" />

    <!-- Outer Diaphragm Rim with depth shadow -->
    <circle cx="48" cy="0" r="44" fill="url(#meddiyRimGrad)" filter="url(#meddiyShadow)" stroke="#FFFFFF" stroke-width="4.5" />
    
    <!-- Non-chill dark retaining ring -->
    <circle cx="48" cy="0" r="35" fill="#0F172A" opacity="0.82" />
    
    <!-- Inner Acoustic Diaphragm disc -->
    <circle cx="48" cy="0" r="31" fill="url(#meddiyDiaphragm)" />
    
    <!-- Specular light sheen on diaphragm -->
    <ellipse cx="42" cy="-8" rx="17" ry="10" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 42 -8)" />
    
    <!-- Center acoustic sound sensor core -->
    <circle cx="48" cy="0" r="10" fill="#FFFFFF" opacity="0.95" />
    <circle cx="48" cy="0" r="5" fill="#0284C7" />
  </g>

  <!-- Accent Sparkle (Clean Clinical Excellence) -->
  <path d="M 128 152 Q 144 152 144 136 Q 144 152 160 152 Q 144 152 144 168 Q 144 152 128 152 Z" fill="#FFFFFF" opacity="0.85" />
  <circle cx="382" cy="178" r="4.5" fill="#FFFFFF" opacity="0.8" />
</svg>
